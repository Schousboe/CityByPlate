<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CityByPlate</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="style.css" />
  
  <script async
    src="https://betterlytics.io/analytics.js"
    data-site-id="citybyplate-mmgxlww5"
    data-web-vitals="true">
  </script>
</head>
<body>
  <div class="container">
    <div class="language-switcher">
      <select id="languageDropdown" class="language-dropdown" onchange="setLanguage(this.value)">
        <option value="en">🇬🇧</option>
        <option value="da">🇩🇰</option>
        <option value="de">🇩🇪</option>
      </select>
    </div>
    <h1 class="heading">Enter a city abbreviation</h1>
    <input id="input" placeholder="e.g. HH, B, M" />
    <button id="searchButton" onclick="findCity()">Search</button>
    <div id="result" class="result"></div>
    <div id="error" class="error"></div>
  </div>

<script src="script.js"> </script>
  
</body>
</html>
